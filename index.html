<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="styles/rock-paper-scissors.css">
<style>

</style>

  <title>Rock-Paper-Scissors</title>

</head>

<body style="height: 1000px;">

  <p class="game">Rock Paper Scissors</p>

  <button class="buttonimg"
   onclick="
   playGame('rock');
    
  "><img src="projectelements/rock-emoji.png"> </button>


  <button class="buttonimg"
    onclick="
    playGame('paper')

  "><img src="projectelements/paper-emoji.png"></button>


  <button class="buttonimg"
    onclick="
    playGame('scissors'); 

  "><img src="projectelements/scissors-emoji.png"></button>



  <p class="js-result"></p>

  <p class="js-moves" ></p>

  <p class="js-score"></p>


  <script>

    
    const score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0 
    };

      updateScore();


    function playGame(playerMove) {
      const computerMove = pickcomputerMove();
      
      let result = '';

      if (playerMove === 'scissors') {

          if (computerMove === 'rock') 
            {result = 'You lose.'}
          else if (computerMove === 'paper') 
            {result = 'You win.'}
          else if (computerMove === 'scissors') 
            {result = 'Tie.'}


      } else if (playerMove === 'paper')  {

          if (computerMove === 'rock') 
            {result = 'You win.'}
          else if (computerMove === 'paper') 
            {result = 'Tie.'}
          else if (computerMove === 'scissors') 
            {result = 'You lose.'}


        } else if (playerMove === 'rock') {
          if (computerMove === 'rock') 
            {result ='Tie.'}
          else if (computerMove === 'paper') 
            {result = 'You lose.'}
          else if (computerMove === 'scissors') 
            {result = 'You win.'}



        }  if (result === 'You win.') {
          score.wins += 1;
        }  else if (result === 'You lose.') {
          score.losses += 1;
        }  else if (result === 'Tie.') {
          score.ties += 1;
        }

        updateScore();

        localStorage.setItem('score', JSON.stringify(score));

        document.querySelector('.js-result').innerHTML = result;

        document.querySelector('.js-moves').innerHTML = `You <img src="projectelements/${playerMove}-emoji.png" class="img">
        <img src="projectelements/${computerMove}-emoji.png" class="img"> Computer`;




        /*alert(
            `You picked ${playerMove}. Computer picked ${computerMove}. ${result}.
            Wins: ${score.wins}, Losses: ${score.losses}, ties: ${score.ties}`
          ); */
  
    } 


      function updateScore() {
        document.querySelector('.js-score').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`   
      } 


      function pickcomputerMove() {

      const randomNumber = Math.random();

      let computerMove = '';

      if (randomNumber >= 0 && randomNumber < 1/3) 
        {computerMove = 'rock'}
      else if (randomNumber >= 1/3 && randomNumber < 2/3) 
        {computerMove = 'paper'}
      else if (randomNumber >= 2/3 && randomNumber < 1) 
        {computerMove = 'scissors'}

        
      return computerMove;

    }

    

    




  </script>


  <button class="reset" onclick="
  score.wins = 0,
  score.losses = 0,
  score.ties = 0,
  localStorage.removeItem('score');
  updateScore();
  ">Reset Score</button>




</body>
</html>
